services:
  - type: web
    name: SkillBarter-1
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PROJECT_NAME
        value: SkillBarter API
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
