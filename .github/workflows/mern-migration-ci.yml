name: MERN Migration CI

concurrency:
  group: mern-migration-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - migration/next-express-mongodb
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify MERN workspace structure and server-only configuration
        run: npm run verify:stack
      - name: Check Express JavaScript syntax
        run: find server/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run server security tests
        run: npm run test -w server
        env:
          NODE_ENV: test
      - name: Lint Next.js frontend
        run: npm run lint -w next-app
      - name: Build Next.js frontend
        run: npm run build
